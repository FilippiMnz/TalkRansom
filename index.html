            <!-- ===== CONCEITO ===== -->
            <section data-markdown>
                <textarea data-template>
                    <span class="label">CONCEITO</span>
                    ## Ransomware ≠ Wiper
                    * **Ransomware:** Cifra para extorquir. A chave existe. O dado é recuperável.
                    * **Wiper:** Cifra para destruir. A chave nunca existiu. O dado é perdido para sempre.
                    <div class="box-red">
                        <strong>NotPetya (2017):</strong> Parecia ransomware, mas era wiper. A "chave" era um UUID aleatório descartado na hora. Mesmo pagando, impossível recuperar.
                    </div>
                    > "NotPetya não queria seu dinheiro. Queria ver o mundo queimar."
                </textarea>
            </section>

            <!-- ===== COMO FUNCIONA UM RANSOMWARE ===== -->
            <section data-markdown>
                <textarea data-template>
                    <span class="label">CONCEITO</span>
                    ## Como um Ransomware Funciona?
                    
                    **Criptografia Simétrica (AES):**
                    * Uma única chave para cifrar E decifrar.
                    * Rápida. Ideal para arquivos grandes.
                    * Problema: como entregar a chave sem ser interceptada?
                    
                    **Criptografia Assimétrica (RSA):**
                    * Duas chaves: pública (cifra) e privada (decifra).
                    * A chave pública pode ser compartilhada abertamente.
                    * A chave privada nunca sai do atacante.
                    
                    <div class="box">
                        <strong>Ransomware real = Híbrido:</strong><br>
                        1. Gera chave AES aleatória (rápida)<br>
                        2. Cifra arquivos com AES<br>
                        3. Cifra a chave AES com RSA público do atacante<br>
                        4. Apaga a chave AES da memória<br>
                        <span class="text-accent">Resultado: só o atacante (dono da chave privada RSA) pode recuperar.</span>
                    </div>
                </textarea>
            </section>

            <!-- ===== BLOCO 1 ===== -->
            <section>
                <section data-markdown>
                    <textarea data-template>
                        <span class="label">BLOCO 1</span>
                        ## Quando a Criptografia Funciona
                        Casos onde o decryptor **NÃO** veio de falha técnica, mas de **apreensão policial**. A matemática permaneceu intacta.
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        <span class="label">BLOCO 1</span>
                        ## CryptoLocker (2013)
                        ### O Pioneiro da Criptografia Híbrida
                        * **AES-256** para cifrar arquivos (rápido e implacável).
                        * **RSA-2048** para proteger a chave AES (key wrapping).
                        * Chave AES gerada aleatoriamente. Nunca toca o disco em texto claro.
                        * Chave privada RSA existe apenas no servidor C2 do atacante.
                        <div class="box">
                            <strong>Como foi derrotado?</strong><br>
                            Operação Tovar (FBI/Interpol) → apreensão dos servidores C2 e chaves privadas.<br>
                            <span class="terminal-font text-accent">A criptografia nunca foi quebrada. A infra que caiu.</span>
                        </div>
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        <span class="label">BLOCO 1</span>
                        ## Hive (2021-2022)
                        * Grupo extremamente ativo. Alvejaram hospitais, infraestrutura crítica.
                        * FBI manteve acesso à infraestrutura por **7 meses** antes de agir.
                        * Em 2022, distribuíram chaves de decifragem para vítimas.
                        * <span class="text-accent">A criptografia não foi quebrada. O C2 foi comprometido.</span>
                        <div class="box-red">
                            <strong>Porém...</strong> Algumas variações tinham falhas humanas:<br>
                            • Chave exposta na memória antes da limpeza<br>
                            • Vazamento parcial no tráfego de rede<br>
                            • Gerenciamento preguiçoso de buffers
                        </div>
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        <span class="label">BLOCO 1</span>
                        ## NotPetya (2017) — O Caso Atípico
                        * Parecia ransomware: tela de resgate, endereço Bitcoin.
                        * Na prática: corrompia permanentemente. A "chave" era aleatória e descartada.
                        * Atribuído à Rússia. Alvo principal: Ucrânia.
                        * Usava EternalBlue (NSA leak) para se espalhar. +$10 bilhões em danos.
                        <div class="box-red">
                            <strong>Este NÃO é ransomware.</strong> É um wiper.<br>
                            Usou criptografia como arma de destruição, não de extorsão.<br>
                            <span class="text-red">Wiper ≠ Ransomware.</span>
                        </div>
                    </textarea>
                </section>
            </section>

                    </textarea>

                <section data-markdown>
                    <textarea data-template>
                        <span class="label-red">BLOCO 2</span>
                        ## Petya — Versões Iniciais (2016)
                        * **Abordagem inteligente:** Cifrava a MFT (Master File Table), não os arquivos.
                        * Sistema nem conseguia "ver" os arquivos no disco.
                        * **Falha:** Derivação de chave com entropia baixa. Seed previsível (dados da vítima).
                        <div class="box-red">
                            <strong>Resultado:</strong> Decryptors exploraram a derivação frágil.<br>
                            A ideia era genial. A execução deixou a porta aberta.
                        </div>
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        <span class="label-red">BLOCO 2</span>
                        ## Stampado — Criptografia de Centavos
                        A "criptografia" era **XOR com reutilização de chave**.
                        * Chave curta e repetida ciclicamente.
                        * Dois arquivos com mesma keystream: `Cifra1 XOR Cifra2 = Plain1 XOR Plain2`.
                        * Conhecendo um cabeçalho (ex: `%PDF-1.4`), recupera todo o resto.
                        * Chave extraível do binário com `strings`.
                        > "A matemática não perdoa preguiça. Ainda mais com XOR."
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        <span class="label-red">BLOCO 2</span>
                        ## HiddenTear — O Presente que Virou Praga
                        * **Origem nobre:** Material didático de um professor. Código aberto no GitHub.
                        * **Uso criminoso:** Copiaram sem entender nada. Cegos no escuro.
                        * Dezenas de variantes... **todas quebradas**.
                        <div class="box">
                            O algoritmo era correto: AES-256.<br>
                            <span class="text-red">A implementação criminosa conseguiu ser pior que a didática.</span>
                        </div>
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        <span class="label-red">BLOCO 2</span>
                        ## HiddenTear — Catálogo de Erros
                        | # | Erro encontrado nas variantes |
                        |---|------|
                        | 1 | Chave em texto plano no binário (`strings ransomware.exe`) |
                        | 2 | Reutilização de chaves (mesma chave para tudo e todos) |
                        | 3 | Chave viva em memória por tempo excessivo (dump → extração) |
                        | 4 | Sem limpeza de buffers (recuperação forense da RAM) |
                        | 5 | Debug ativo em produção (`Console.WriteLine(senha)`) |
                        | 6 | Senha hardcoded: `"MyCryptoKey123"` |
                        <br>

                        <span class="label">BLOCO 3</span>
                        ## Demonstração Prática 🧪
                        **Objetivo:** Provar a tese ao vivo. VM isolada. Três cenários.
                        * **Caso 1:** Ransomware bem implementado → AES-256 + RSA-4096 + limpeza de memória.
                        * **Caso 2:** MESMO código, com erro humano → chave hardcoded, nonce fixo, sem RSA.
                        * **Bônus:** AES implementado manualmente em C → S-Box errada, rounds errados.
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        <span class="label">BLOCO 3</span>
                        ## Caso 1: O Ransomware Perfeito
                        * AES-256-CTR com chave aleatória (`/dev/urandom`).
                        * RSA-4096 OAEP SHA-256 para key wrapping.
                        * Nonce único por sessão. Limpeza explícita de memória (`memset` + `del`).
                        <div class="box">
                            <strong>Resultado esperado:</strong><br>
                            Impossível decifrar sem a chave privada RSA-4096.<br>
                            <span class="text-red">Força bruta: 2^256 combinações. ~10^60 anos.</span><br>
                            <span class="terminal-font text-accent">AES e RSA fizeram seu trabalho. Ninguém passa por eles.</span>
